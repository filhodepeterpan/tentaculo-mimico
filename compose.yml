# MONGO_URI=mongodb://admin:admin@localhost:27017/mydb?authSource=admin ./mvnw spring-boot:run
services:
  mongodb:
    image: mongo:7.0.14
    container_name: mongodb_community
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    ports:
      - "27017:27017"
    restart: unless-stopped

