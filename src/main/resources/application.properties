spring.application.name=TentaculoMimico
server.port=${PORT:8080}

resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM:onboarding@resend.dev}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mongodb.uri=${MONGO_URI}
spring.thymeleaf.cache=false
spring.data.mongodb.auto-index-creation=true

pagbank.token=${PAGBANK_TOKEN:}
pagbank.environment=${PAGBANK_ENVIRONMENT:sandbox}
pagbank.public-base-url=${APP_PUBLIC_BASE_URL:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

server.error.whitelabel.enabled=false
# Base dos links enviados por e-mail. No Render vem de APP_PUBLIC_BASE_URL; localmente cai no localhost.
app.base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
