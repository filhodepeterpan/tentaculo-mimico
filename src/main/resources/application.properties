spring.application.name=TentaculoMimico
server.port=8080

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mongodb.uri=${MONGO_URI}
spring.thymeleaf.cache=false

# SE IMPLEMENTADO CORRETAMENTE, UTILIZAR ISSO AQUI DEVE TROCAR TODOS OS REPOSITORIES E SERVIÇOS DA IMPLEMENTAÇÃO REAL PARA A IMPLEMENTAÇÃO MOCK
spring.profiles.active=mock
