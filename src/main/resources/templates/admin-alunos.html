<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/pages/painel-admin.css}">
    <title>Gestão de alunos</title>
</head>
<body>

<div th:replace="~{fragments/layouts :: header}"></div>

<main class="painel-admin">
    <a th:href="@{/admin}">← Voltar ao painel</a>
    <h1 class="painel-admin__titulo">Gestão de alunos</h1>

    <p id="erro" hidden></p>
    <ul id="lista"></ul>
</main>

<div th:replace="~{fragments/layouts :: footer}"></div>

<script>
    fetch('/api/admin/alunos', { credentials: 'same-origin' })
        .then(r => {
            if (!r.ok) throw new Error('Não foi possível carregar os alunos.');
            return r.json();
        })
        .then(alunos => {
            const lista = document.getElementById('lista');
            alunos.forEach(a => {
                const li = document.createElement('li');
                const cursos = (a.cursos || []).map(c => c.nome).join(', ') || 'sem cursos';
                li.textContent = a.nome + ' (' + a.email + ') - ' + cursos;
                lista.append(li);
            });
        })
        .catch(e => {
            const erro = document.getElementById('erro');
            erro.textContent = e.message;
            erro.hidden = false;
        });
</script>
</body>
</html>
