<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/pages/painel-admin.css}">
    <title>Gestão de cursos</title>
</head>
<body>

<div th:replace="~{fragments/layouts :: header}"></div>

<main class="painel-admin">
    <a th:href="@{/admin}">← Voltar ao painel</a>
    <h1 class="painel-admin__titulo">Gestão de cursos</h1>

    <p id="erro" hidden></p>
    <ul id="lista"></ul>
</main>

<div th:replace="~{fragments/layouts :: footer}"></div>

<script>
    fetch('/api/admin/cursos', { credentials: 'same-origin' })
        .then(r => {
            if (!r.ok) throw new Error('Não foi possível carregar os cursos.');
            return r.json();
        })
        .then(cursos => {
            const lista = document.getElementById('lista');
            cursos.forEach(c => {
                const li = document.createElement('li');
                li.textContent = c.nome + ' - Prof. ' + (c.professorNome || 'sem professor')
                    + ' - ' + (c.cargaHoraria || '?') + ' h';
                lista.append(li);
            });
        })
        .catch(e => {
            const erro = document.getElementById('erro');
            erro.textContent = e.message;
            erro.hidden = false;
        });
</script>
</body>
</html>
