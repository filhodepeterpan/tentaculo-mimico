<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/pages/curso-detalhes.css}">
  <title>Tentáculo Mímico</title>
</head>
<body>

<div th:replace="~{fragments/layouts :: header}"></div>

<section class="curso-detalhes__topo">
  <div class="curso-detalhes__topo-texto">
    <h1 class="curso-detalhes__titulo" th:text="${curso.nome}">Nome do curso</h1>

    <div class="curso-detalhes__status">
      <th:block th:if="${matriculaConfirmada != null and matriculaConfirmada}">
        <div th:replace="~{fragments/badge :: badge(texto='Matrícula confirmada', variante='sucesso')}"></div>
      </th:block>
      <th:block th:if="${(matriculaConfirmada == null or !matriculaConfirmada) and curso.vagasDisponiveis == 0}">
        <div th:replace="~{fragments/badge :: badge(texto='Turma lotada', variante='erro')}"></div>
      </th:block>
      <th:block th:if="${(matriculaConfirmada == null or !matriculaConfirmada) and curso.vagasDisponiveis > 0 and curso.vagasDisponiveis <= 5}">
        <div th:replace="~{fragments/badge :: badge(texto='Vagas limitadas', variante='atencao')}"></div>
      </th:block>
    </div>


  </div>

  <th:block th:if="${curso.imagemCapa != null and !curso.imagemCapa.isEmpty()}">
    <img th:src="@{${curso.imagemCapa}}" th:alt="'Foto do curso ' + ${curso.nome}" class="curso-detalhes__capa">
  </th:block>
  <th:block th:unless="${curso.imagemCapa != null and !curso.imagemCapa.isEmpty()}">
    <img th:src="@{/img/mascara.png}" alt="duas mascaras, símbolo clássico de teatro" class="curso-detalhes__ilustracao">
  </th:block>
</section>

<section class="curso-detalhes__conteudo">

  <p class="curso-detalhes__descricao" th:text="${curso.descricao}">Descrição do curso</p>

  <a th:href="@{/perfil/professor/{id}(id=${curso.professorId})}" class="curso-detalhes__professor">
    <img th:if="${curso.professorFotoPerfil != null and !curso.professorFotoPerfil.isEmpty()}" th:src="@{${curso.professorFotoPerfil}}" th:alt="'Foto de ' + ${curso.professorNome}" class="curso-detalhes__professor-foto">
    <span th:unless="${curso.professorFotoPerfil != null and !curso.professorFotoPerfil.isEmpty()}" class="curso-detalhes__professor-foto curso-detalhes__professor-foto--vazia" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/>
      </svg>
    </span>
    <span class="curso-detalhes__professor-textos">
      <span class="curso-detalhes__professor-rotulo">Professor(a)</span>
      <span class="curso-detalhes__professor-nome" th:text="${curso.professorNome}">Nome do professor</span>
    </span>
  </a>

  <div class="curso-detalhes__chips">
    <div class="chip-info chip-info--quando">
      <span class="chip-info__marcador" aria-hidden="true"></span>
      <span class="chip-info__texto">
        <span class="chip-info__rotulo">Quando</span>
        <span class="chip-info__valor">
        <span th:each="h, iter : ${curso.horarios}">
            <span th:text="${h.diaSemana}"></span> <span th:text="${h.inicio} + '-' + ${h.fim}"></span><span th:if="${!iter.last}">, </span>
        </span>
        </span>
      </span>
    </div>

    <div class="chip-info chip-info--onde">
      <span class="chip-info__marcador" aria-hidden="true"></span>
      <span class="chip-info__texto">
        <span class="chip-info__rotulo">Onde</span>
        <span class="chip-info__valor">Av. Pres. Kennedy, Solemar</span>
      </span>
    </div>

    <div class="chip-info chip-info--contato">
      <span class="chip-info__marcador" aria-hidden="true"></span>
      <span class="chip-info__texto">
        <span class="chip-info__rotulo">Contato</span>
        <span class="chip-info__valor">@tentaculomimico</span>
      </span>
    </div>
  </div>

  <div class="curso-detalhes__acoes">
    <div class="curso-detalhes__info-extra">
      <div class="curso-detalhes__info-item">
        <span class="curso-detalhes__info-rotulo">Carga horária</span>
        <span class="curso-detalhes__info-valor" th:text="${curso.cargaHoraria} + ' horas'">40 horas</span>
      </div>
      <div class="curso-detalhes__info-item">
        <span class="curso-detalhes__info-rotulo">Vagas</span>
        <span class="curso-detalhes__info-valor" th:text="${curso.vagasDisponiveis} + ' de ' + ${curso.vagasTotais} + ' disponíveis'">Vagas</span>
      </div>
      <div class="curso-detalhes__info-item">
        <span class="curso-detalhes__info-rotulo">Preço mensal</span>
        <span class="curso-detalhes__info-valor" th:text="'R$ ' + ${curso.preco}">R$ 0,00</span>
      </div>
    </div>
    <div class="curso-detalhes__acoes-botoes">

      <th:block th:if="${ehProprietario != null and ehProprietario}">
        <a th:href="@{/cursos/{id}/editar(id=${curso.id})}" class="botao botao--neutro botao--pequeno">Editar</a>
        <button type="button" class="botao botao--perigo botao--pequeno" data-modal-abrir="modal-deletar-curso">Excluir curso</button>
      </th:block>

      <th:block th:if="${tipoUsuarioLogado == 'aluno' and (statusMatricula == null or statusMatricula == 'cancelada')}">
        <button type="button" class="curso-detalhes__matricular" data-modal-abrir="modal-matricula" th:disabled="${curso.vagasDisponiveis == 0}">
          <span class="curso-detalhes__matricular-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"/>
              <polyline points="7 7 17 7 17 17"/>
            </svg>
          </span>
          Matricule-se
        </button>
      </th:block>

      <th:block th:if="${tipoUsuarioLogado == 'aluno' and statusMatricula == 'pendente'}">
        <div th:replace="~{fragments/badge :: badge(texto='Aguardando aprovação', variante='atencao')}"></div>
      </th:block>

      <th:block th:if="${tipoUsuarioLogado == 'aluno' and statusMatricula == 'recusada'}">
        <div th:replace="~{fragments/badge :: badge(texto='Matrícula recusada', variante='erro')}"></div>
      </th:block>

      <th:block th:if="${tipoUsuarioLogado == 'aluno' and statusMatricula == 'aceita_aguardando_pagamento'}">
        <a th:href="@{/pagamentos/{id}(id=${matriculaId})}" class="botao botao--primario botao--pequeno">Pagar</a>
      </th:block>

      <th:block th:if="${tipoUsuarioLogado == 'aluno' and statusMatricula == 'ativa'}">
        <button type="button" class="botao botao--perigo botao--pequeno" data-modal-abrir="modal-desistir">Desistir da matrícula</button>
      </th:block>

    </div>
  </div>

  <th:block th:if="${erroMatricula != null}">
    <div th:replace="~{fragments/alert :: alerta(titulo='Não foi possível confirmar a matrícula', mensagem=${erroMatricula}, variante='erro')}"></div>
  </th:block>

</section>

<form id="form-matricula" method="post" th:action="@{/cursos/{id}/matricula(id=${curso.id})}" hidden></form>
<form id="form-deletar-curso" method="post" th:action="@{/cursos/{id}/excluir(id=${curso.id})}" hidden></form>
<form th:if="${matriculaId != null}" id="form-desistir" method="post" th:action="@{/matriculas/{id}/cancelar(id=${matriculaId})}" hidden></form>

<div th:replace="~{fragments/modal :: modal(id='modal-matricula', titulo='Confirmar matrícula?', mensagem='Sua solicitação será enviada para aprovação do professor. O acesso ao curso só é liberado após a aprovação e a confirmação do pagamento.', textoCancelar='Cancelar', textoConfirmar='Confirmar', varianteConfirmar='primario')}"></div>

<th:block th:if="${ehProprietario != null and ehProprietario}">
  <div th:replace="~{fragments/modal :: modal(id='modal-deletar-curso', titulo='Excluir este curso?', mensagem='Essa ação não pode ser desfeita. Alunos matriculados perderão acesso ao curso.', textoCancelar='Cancelar', textoConfirmar='Excluir', varianteConfirmar='perigo')}"></div>
</th:block>

<th:block th:if="${tipoUsuarioLogado == 'aluno' and statusMatricula == 'ativa'}">
  <div th:replace="~{fragments/modal :: modal(id='modal-desistir', titulo='Desistir da matrícula?', mensagem='Você vai perder o acesso a este curso. Essa ação não pode ser desfeita.', textoCancelar='Cancelar', textoConfirmar='Desistir', varianteConfirmar='perigo')}"></div>
</th:block>

<div th:replace="~{fragments/layouts :: footer}"></div>

<script type="module" th:src="@{/js/pages/curso-detalhes.js}"></script>
</body>
</html>
