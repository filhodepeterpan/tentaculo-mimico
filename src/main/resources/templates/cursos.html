<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/pages/cursos.css}">
  <title>Tentáculo Mímico</title>
</head>
<body>

<div th:replace="~{fragments/layouts :: header}"></div>

<main class="cursos">
  <h1 class="cursos__titulo">Cursos</h1>

  <div class="cursos__barra">
    <div class="cursos__busca">
      <div th:replace="~{fragments/inputs :: input(id='busca-cursos', tipo='search', rotulo='Buscar cursos', placeholder='Ex: violão, teatro, fotografia...', valor='', obrigatorio=false, mensagemErro='', desabilitado=false)}"></div>
    </div>

    <a th:href="@{/calendario}" class="cursos__botao-calendario">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Ver calendário
    </a>
  </div>

  <p id="cursos__vazio" class="cursos__vazio" hidden>Nenhum curso encontrado.</p>

  <div class="cursos__grid">
    <th:block th:each="curso, cursoStat : ${cursos}">
      <th:block th:with="matriculaAluno=${matriculasPorCurso != null ? matriculasPorCurso.get(curso.id) : null},
                         ehDono=${tipoUsuarioLogado == 'professor' and usuarioLogadoId != null and usuarioLogadoId == curso.professorId}">
        <div th:replace="~{fragments/card :: card(id=${curso.id}, nome=${curso.nome}, cargaHoraria=${curso.cargaHoraria}, vagasDisponiveis=${curso.vagasDisponiveis}, indice=${cursoStat.index}, imagemCapa=${curso.imagemCapa}, statusMatricula=${matriculaAluno != null ? matriculaAluno.status : null}, matriculaId=${matriculaAluno != null ? matriculaAluno.id : null}, ehDono=${ehDono})}"></div>
      </th:block>
    </th:block>
  </div>
</main>

<div th:replace="~{fragments/layouts :: footer}"></div>

<script type="module" th:src="@{/js/pages/cursos.js}"></script>
</body>
</html>
