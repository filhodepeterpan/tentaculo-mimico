<!--
  Componente: Botão

  Parâmetros (os 3 últimos têm valor padrão, então são opcionais):
    texto      -> texto exibido no botão
    variante   -> 'primario' | 'secundario' | 'neutro'    (padrão: 'primario')
    tamanho    -> 'grande' | 'pequeno'                     (padrão: 'grande')
    tipoBotao  -> 'button' | 'submit' | 'reset'            (padrão: 'button')
-->

<button
    th:fragment="botao(texto, variante, tamanho, tipoBotao)"
    th:type="${tipoBotao}"
    th:class="'botao botao--' + ${variante} + ' botao--' + ${tamanho}"
    th:text="${texto}"
></button>

<!--
  Variante do botão que abre um modal (usa o atributo data-modal-abrir).
    modalId      -> id do modal a ser aberto
    desabilitado -> true/false
-->
<button
    th:fragment="botao_modal(texto, variante, tamanho, modalId, desabilitado)"
    type="button"
    th:class="'botao botao--' + ${variante} + ' botao--' + ${tamanho}"
    th:attr="data-modal-abrir=${modalId}"
    th:disabled="${desabilitado}"
    th:text="${texto}"
></button>

<a
    th:fragment="botao_link(texto, variante, tamanho, caminho)"
    th:type="${tipoBotao}"
    th:class="'botao botao--' + ${variante} + ' botao--' + ${tamanho}"
    th:text="${texto}"
    th:href="${caminho}"
>
</a>
