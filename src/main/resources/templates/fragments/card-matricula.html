<!-- cardMatricula(id, nome, cargaHoraria, indice, imagemCapa, statusMatricula, matriculaId) -->
<div th:fragment="cardMatricula(id, nome, cargaHoraria, indice, imagemCapa, statusMatricula, matriculaId)" class="curso-card" th:attr="data-status=${statusMatricula}">

  <a th:href="@{/cursos/{id}(id=${id})}" class="curso-card__link">
    <img th:if="${imagemCapa != null and !imagemCapa.isEmpty()}" th:src="@{${imagemCapa}}" th:alt="'Capa do curso ' + ${nome}" class="curso-card__banner">
    <div th:unless="${imagemCapa != null and !imagemCapa.isEmpty()}" class="curso-card__banner" th:classappend="'curso-card__banner--cor-' + ${indice % 6}"></div>
    <div class="curso-card__conteudo">
      <h3 class="curso-card__titulo" th:text="${nome}">Nome do curso</h3>
      <p class="curso-card__info" th:text="${cargaHoraria} + ' horas'">Info</p>
    </div>
  </a>

  <div class="curso-card__rodape">
    <th:block th:if="${statusMatricula == 'pendente'}">
      <div th:replace="~{fragments/badge :: badge(texto='Aguardando aprovação', variante='atencao')}"></div>
    </th:block>
    <th:block th:if="${statusMatricula == 'recusada'}">
      <div th:replace="~{fragments/badge :: badge(texto='Matrícula recusada', variante='erro')}"></div>
    </th:block>
    <th:block th:if="${statusMatricula == 'cancelada'}">
      <div th:replace="~{fragments/badge :: badge(texto='Cancelada', variante='neutro')}"></div>
    </th:block>

    <a th:if="${statusMatricula == 'aceita_aguardando_pagamento'}" th:href="@{/pagamentos/{id}(id=${matriculaId})}" class="botao botao--primario botao--pequeno">Pagar</a>

    <a th:if="${statusMatricula == 'pendente'}" th:href="@{/cursos/{id}(id=${id})}" class="botao botao--atencao botao--pequeno">Ver status</a>

    <a th:if="${statusMatricula == 'ativa'}" th:href="@{/cursos/{id}(id=${id})}" class="botao botao--sucesso botao--pequeno">Ver curso</a>
  </div>

</div>
