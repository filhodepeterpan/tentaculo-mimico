<!-- imagem(id, rotulo, obrigatorio, mensagemErro, desabilitado) -->
<div th:fragment="imagem(id, rotulo, obrigatorio, mensagemErro, desabilitado)"
     th:with="temErro=${mensagemErro != null and !mensagemErro.isEmpty()}"
     class="campo">

  <label th:for="${id}" class="campo__rotulo" th:text="${rotulo}">Rótulo</label>

  <label th:for="${id}" class="campo-imagem">
    <input
      type="file"
      accept="image/*"
      th:id="${id}"
      th:name="${id}"
      th:required="${obrigatorio}"
      th:disabled="${desabilitado}"
      class="campo-imagem__input"
      th:aria-invalid="${temErro}"
      th:aria-describedby="${temErro} ? (${id} + '-erro') : _"
    />

    <span class="campo-imagem__conteudo" data-campo-imagem-placeholder>
      <svg class="campo-imagem__icone" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <span class="campo-imagem__texto">Clique para escolher uma imagem</span>
    </span>

    <img class="campo-imagem__preview" data-campo-imagem-preview hidden alt="Pré-visualização da imagem selecionada">
  </label>

  <p th:if="${temErro}"
     th:id="${id} + '-erro'"
     class="campo__mensagem-erro"
     th:text="${mensagemErro}">
    Mensagem de erro
  </p>

</div>
