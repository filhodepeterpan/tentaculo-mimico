<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header">
    <a th:href="@{/}" class="brand">
        <img
                class="brand__img"
                th:src="@{/img/brand.svg}"
                alt="Tentáculo Mímico"
        />
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true" />
    <label for="nav-toggle" class="nav-toggle__label" aria-label="Abrir/fechar menu">
        <span></span><span></span><span></span>
    </label>
    <nav class="main-nav" aria-label="Navegação principal">
        <ul>
            <li>
                <a class="title-medium" th:href="@{/}">Início</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/sobre}">Sobre</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/cursos}">Cursos</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/calendario}">Calendário</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/contato}">Contato</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/doacoes}">Doações</a>
            </li>
        </ul>
    </nav>

    <div class="site-header__actions">
        <!-- Se NÃO estiver logado: exibe botões de Entrar e Registrar-se -->
        <th:block th:if="${usuarioLogado == null}">
            <div th:replace="~{fragments/buttons :: botao_link(texto='Entrar', variante='neutro', tamanho='grande', caminho='/login')}"></div>
            <div th:replace="~{fragments/buttons :: botao_link(texto='Registrar-se', variante='primario', tamanho='grande', caminho='/cadastro')}"></div>
        </th:block>

        <!-- Logado: nome + foto abrem um menu com "Meu perfil" e "Sair". O administrador (sem página de
             perfil e sem foto) vê "Painel administrativo" no lugar do nome, e o menu tem "Gerenciar" e "Sair".
             Abre/fecha com <details>; menu-usuario.js fecha ao clicar fora ou apertar ESC. -->
        <details th:if="${usuarioLogado != null}" class="menu-usuario" data-menu-usuario>
            <summary class="user-profile-button menu-usuario__gatilho" aria-label="Abrir menu do usuário">
                <!-- Administrador: só o texto, sem foto. O texto fica visível também no mobile. -->
                <span th:if="${usuarioLogado.tipoUsuario.name() == 'ADMINISTRADOR'}"
                      class="menu-usuario__rotulo-admin title-medium">Painel administrativo</span>

                <th:block th:if="${usuarioLogado.tipoUsuario.name() != 'ADMINISTRADOR'}">
                    <span class="user-profile-name title-medium" th:text="${usuarioLogado.nome}">Nome do Usuário</span>

                    <!-- Com foto: mostra a foto -->
                    <img th:if="${usuarioLogado.fotoPerfil != null and !#strings.isEmpty(usuarioLogado.fotoPerfil)}"
                         th:src="${usuarioLogado.fotoPerfil}"
                         alt="Foto de perfil"
                         class="menu-usuario__foto" />

                    <!-- Sem foto: mostra a inicial do nome num círculo -->
                    <span th:unless="${usuarioLogado.fotoPerfil != null and !#strings.isEmpty(usuarioLogado.fotoPerfil)}"
                          th:text="${#strings.toUpperCase(#strings.substring(usuarioLogado.nome, 0, 1))}"
                          aria-hidden="true"
                          class="menu-usuario__foto menu-usuario__foto--inicial">A</span>
                </th:block>
            </summary>

            <ul class="menu-usuario__lista">
                <li th:if="${usuarioLogado.tipoUsuario.name() == 'ADMINISTRADOR'}">
                    <a th:href="@{/admin}" class="menu-usuario__item">Gerenciar</a>
                </li>
                <li th:if="${usuarioLogado.tipoUsuario.name() != 'ADMINISTRADOR'}">
                    <a th:href="${usuarioLogado.tipoUsuario.name() == 'PROFESSOR'}
                                ? @{/perfil/professor/{id}(id=${usuarioLogado.id})}
                                : @{/perfil/aluno/{id}(id=${usuarioLogado.id})}"
                       class="menu-usuario__item">Meu perfil</a>
                </li>
                <li>
                    <a th:href="@{/sair}" class="menu-usuario__item">Sair</a>
                </li>
            </ul>
        </details>
    </div>
</header>

<footer th:fragment="footer" class="site-footer">
    <a th:href="@{/}" class="brand">
        <img
                class="brand__img"
                th:src="@{/img/brand_dark.svg}"
                alt="Tentáculo Mímico"
        />
    </a>
    <nav
            class="footer-nav main-nav"
            aria-label="Links de navegação do rodapé"
    >
        <ul>
            <li><a class="title-medium" th:href="@{/}">Início</a></li>
            <li>
                <a class="title-medium" th:href="@{/cursos}">Cursos</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/sobre}">Sobre</a>
            </li>
            <li th:if="${usuarioLogado == null}">
                <a class="title-medium" th:href="@{/cadastro}">Cadastro</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/calendario}">Calendário</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/contato}">Contato</a>
            </li>
            <li>
                <a class="title-medium" th:href="@{/doacoes}">Doações</a>
            </li>
        </ul>
    </nav>
    <p>&copy; 2026 Tentáculo Mímico. Todos os direitos reservados.</p>
    <div th:replace="~{fragments/modal-cpf :: modalCpf()}"></div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="https://cdn.userway.org/widget.js" data-account="1PNOl5vsyO"></script>
    <script th:src="@{/js/navegacao-teclado.js}" defer></script>
    <script type="module" th:src="@{/js/componentes/menu-usuario.js}"></script>
</footer>
</body>
</html>
